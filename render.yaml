services:
  - type: web
    name: uni-bot-backend
    runtime: python
    plan: free
    rootDir: backend
    # Install deps, then pre-build the vector index at build time. The free runtime
    # instance (512 MB) cannot bulk-embed ~5,600 chunks, but build machines can; the
    # resulting ChromaDB files are baked into the image and opened read-only at runtime.
    buildCommand: pip install -r requirements.txt && python build_index.py
    # main.py reads PORT from the environment in Python, so this does not depend
    # on shell expansion of $PORT at the command line.
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false        # set securely in the Render dashboard
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      # Paths are relative to the service rootDir (backend/), matching local dev.
      - key: DOCS_DIR
        value: ../university_docs
      - key: CHROMA_DIR
        value: ../chroma_db
      # Free-tier disk is ephemeral, so rebuild the index automatically on boot.
      - key: AUTO_LOAD
        value: "true"
      # Comma-separated list of allowed frontend origins; "*" only for testing.
      - key: ALLOWED_ORIGINS
        sync: false
